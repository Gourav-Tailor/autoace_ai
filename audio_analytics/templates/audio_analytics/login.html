<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoAce AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; }
        .login-card { width: 100%; max-width: 400px; border-radius: 12px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card login-card shadow-lg p-4 bg-white">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">AutoAce AI</h3>
            <p class="text-muted small">Voice Analytics Evaluation Portal</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger py-2 small" role="alert">
            Invalid username or password. Please try again.
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold">Username</label>
                <input type="text" name="username" class="form-control" id="id_username" required autofocus placeholder="Enter your username">
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" id="id_password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Sign In</button>
        </form>
    </div>

</body>
</html>
