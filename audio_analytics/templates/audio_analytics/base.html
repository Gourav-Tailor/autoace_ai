<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AudoAck AI - Audio Analytics{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #1e293b; color: #fff; }
        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            border-radius: 6px;
        }
        .sidebar a:hover,
        .sidebar a.active {
            background-color: #334155;
            color: #fff;
        }
        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">

            {% if user.is_authenticated %}

                <!-- Sidebar -->
                <div class="col-md-2 sidebar p-3 d-flex flex-column">
                    <h4 class="fw-bold mb-4 text-white">AudoAck AI</h4>

                    <nav class="nav flex-column gap-1">
                        <a href="{% url 'dashboard' %}"
                           class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                            Dashboard
                        </a>

                        <a href="{% url 'batch_list' %}"
                           class="{% if request.resolver_match.url_name == 'batch_list' %}active{% endif %}">
                            Batch Processing
                        </a>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'long_recorder' %}">Live Recorder</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'device_tokens' %}">Device Tokens</a>
                        </li>
                    </nav>

                    <div class="mt-auto pt-3 border-top border-secondary">
                        <div class="text-light small mb-2">
                            Signed in as <strong>{{ user.username }}</strong>
                        </div>

                        <form action="{% url 'logout' %}" method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light btn-sm w-100">
                                Sign Out
                            </button>
                        </form>
                    </div>
                </div>

            {% endif %}

            <!-- Main Content -->
            <div class="{% if user.is_authenticated %}col-md-10{% else %}col-12{% endif %} p-4">
                {% block content %}{% endblock %}
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
