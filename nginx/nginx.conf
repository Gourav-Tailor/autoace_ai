upstream django_app {
    server web:8000;
}

upstream minio_api {
    server minio:9000;
}

server {
    listen 80;
    server_name audoack.in www.audoack.in localhost;

    client_max_body_size 100M;

    # Internet scanners commonly probe Django deployments for PHP,
    # WordPress and secret/config files. Reject these at the edge so
    # they never reach Django/Gunicorn and do not pollute application logs.
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|phpmyadmin|\.env|\.git|\.aws|terraform\.tfstate) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(php|php[0-9]?|asp|aspx|jsp)$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /autoace-media/ {
        proxy_pass http://minio_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;

        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /favicon.ico {
        alias /app/staticfiles/audio_analytics/favicon.ico;
        access_log off;
        log_not_found off;
    }
}
