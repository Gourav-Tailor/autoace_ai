upstream django_app {
    server web:8000;
}

upstream minio_api {
    server minio:9000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;

    # Serve Static Files Directly
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve Media Files Directly
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # HTTPS-safe public MinIO/S3 endpoint.
    #
    # Django generates presigned URLs against https://audoack.in.
    # Google HTTPS Load Balancer terminates TLS and forwards to this Nginx
    # container over HTTP. Nginx then proxies the request to MinIO internally.
    #
    # IMPORTANT:
    # - Keep the original URI so /autoace-media/<object-key> reaches MinIO.
    # - Preserve the public Host because the SigV4 URL is signed for audoack.in.
    # - Do NOT expose MinIO ports 9000/9001 directly on the VM.
    location /autoace-media/ {
        proxy_pass http://minio_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
    }

    # Proxy all other requests to Gunicorn
    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;

        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /favicon.ico {
        alias /app/staticfiles/audio_analytics/favicon.ico;
        access_log off;
        log_not_found off;
    }
}
