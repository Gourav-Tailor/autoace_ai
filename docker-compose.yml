version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: autoace_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autoace_redis
    restart: always

  web:
    image: ghcr.io/gourav-tailor/autoace_ai:latest
    container_name: autoace_django
    restart: always
    command: >
      sh -c "python manage.py wait_for_db &&
            python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            gunicorn autoace_ai.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    image: ghcr.io/gourav-tailor/autoace_ai:latest
    container_name: autoace_celery
    restart: always
    command: celery -A autoace_ai worker --loglevel=info
    volumes:
      - media_data:/app/media
      - hf_cache:/root/.cache/huggingface
      - numba_cache:/app/numba_cache
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: autoace_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_data:
  media_data:
  hf_cache:
  numba_cache: