version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: autoace_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autoace_redis
    restart: always

  minio:
    image: minio/minio:latest
    container_name: autoace_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    volumes:
      - minio_data:/data
    # MinIO is intentionally NOT published to the VM host.
    # Browser access goes through:
    # HTTPS LB -> Nginx -> minio:9000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio_init:
    image: minio/mc:latest
    container_name: autoace_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-autoace-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_NAME
      "

  web:
    image: ghcr.io/gourav-tailor/autoace_ai:latest
    container_name: autoace_django
    restart: always
    command: >
      sh -c "python manage.py wait_for_db &&
            python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            gunicorn autoace_ai.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 300"
    volumes:
      - static_data:/app/staticfiles
      - upload_tmp:/tmp
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio_init:
        condition: service_completed_successfully

  celery_worker:
    image: ghcr.io/gourav-tailor/autoace_ai:latest
    container_name: autoace_celery
    restart: always
    command: celery -A autoace_ai worker --loglevel=info
    volumes:
      - hf_cache:/root/.cache/huggingface
      - numba_cache:/app/numba_cache
      - upload_tmp:/tmp
    env_file:
      - .env
    environment:
      HF_TOKEN: ${HF_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio_init:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    container_name: autoace_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - web
      - minio

volumes:
  postgres_data:
  static_data:
  minio_data:
  hf_cache:
  numba_cache:
  upload_tmp:
