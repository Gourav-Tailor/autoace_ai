version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: autoace_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/gourav-tailor/autoace_ai:latest
    container_name: autoace_django
    restart: always
    command: >
      sh -c "python manage.py wait_for_db &&
            python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            gunicorn autoace_ai.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 300"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - hf_cache:/root/.cache/huggingface
      - numba_cache:/app/numba_cache
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  static_data:
  hf_cache:
  numba_cache: